<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="sidebar">
        <div class="logo">Taskify</div>
        <ul class="nav-links">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="today.html">Today</a></li>
            <li><a href="overdue.html" class="active">Overdue</a></li>

            <div class="task-item">

            <div class="task-item">
                <div class="task-info">
                    <input type="checkbox">
                    <span>Update Cloud Database Credentials</span>
                </div>
                <span class="badge overdue">Overdue (Aug 15)</span>
            </div>
        </div>
    </div>
