<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskify - Today's Tasks</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="sidebar">
        <div class="logo">Taskify</div>
        <ul class="nav-links">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="today.html" class="active">Today</a></li>
            <li><a href="overdue.html">Overdue</a></li>
            <li><a href="tasks.html">All Tasks</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="register.html">Register</a></li>
        </ul>

    <div class="main-content">
        <div class="header">
            <h1>Today's Tasks</h1>
        </div>

        <div class="tasks-section">
            <h2>Tasks Due Today</h2>

            <div class="task-item">
                <div class="task-info">
                    <input type="checkbox">
                    <span>Review Landing Page Design</span>
                </div>
                <span class="badge today">Today</span>
            </div>

            <div class="task-item">
                <div class="task-info">
                    <input type="checkbox" checked>
                    <span>Read a chapter from Clean Code</span>
                </div>
                <span class="badge done">Completed</span>
            </div>
        </div>
    </div>

</body>
